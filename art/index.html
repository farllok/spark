<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1024,initial-scale=1">
  <title>ONE SPARK</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07080c}body{display:grid;place-items:center}svg{display:block;width:1024px;height:1024px;max-width:100vw;max-height:100vh}
  </style>
</head>
<body onload="requestAnimationFrame(function(){window.__artReady=true})">
<svg viewBox="0 0 1024 1024" role="img" aria-label="A colossal match ignites a sun-sized flare around a newborn ringed planet">
  <defs>
    <radialGradient id="space" cx="63%" cy="39%" r="76%">
      <stop offset="0" stop-color="#35120e"/>
      <stop offset=".29" stop-color="#130b0d"/>
      <stop offset=".72" stop-color="#08090e"/>
      <stop offset="1" stop-color="#040509"/>
    </radialGradient>
    <radialGradient id="sun" cx="48%" cy="50%" r="55%">
      <stop offset="0" stop-color="#fffdf1"/>
      <stop offset=".13" stop-color="#fff3d6"/>
      <stop offset=".35" stop-color="#ffd166"/>
      <stop offset=".64" stop-color="#ff8a2b" stop-opacity=".92"/>
      <stop offset="1" stop-color="#ff4d1a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="flareHot" x1="0" y1="1" x2="1" y2="0">
      <stop stop-color="#ff4d1a" stop-opacity=".05"/>
      <stop offset=".3" stop-color="#ff8a2b" stop-opacity=".94"/>
      <stop offset=".61" stop-color="#fff3d6"/>
      <stop offset="1" stop-color="#ff8a2b" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="flareGold" x1="0" y1="1" x2="1" y2="0">
      <stop stop-color="#ff4d1a" stop-opacity="0"/>
      <stop offset=".36" stop-color="#ffd166"/>
      <stop offset=".58" stop-color="#fff3d6"/>
      <stop offset="1" stop-color="#ff4d1a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#fff3d6"/>
      <stop offset=".42" stop-color="#e8c992"/>
      <stop offset=".72" stop-color="#9b6b42"/>
      <stop offset="1" stop-color="#2d1b1b"/>
    </linearGradient>
    <radialGradient id="head" cx="60%" cy="35%" r="72%">
      <stop stop-color="#ff8a2b"/>
      <stop offset=".18" stop-color="#82301e"/>
      <stop offset=".56" stop-color="#25151a"/>
      <stop offset="1" stop-color="#08090e"/>
    </radialGradient>
    <radialGradient id="planet" cx="35%" cy="28%" r="78%">
      <stop stop-color="#e8fbff"/>
      <stop offset=".2" stop-color="#6fd3ff"/>
      <stop offset=".55" stop-color="#1769a0"/>
      <stop offset=".83" stop-color="#0d2343"/>
      <stop offset="1" stop-color="#07080c"/>
    </radialGradient>
    <filter id="blur80" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="80"/></filter>
    <filter id="blur34" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="34"/></filter>
    <filter id="blur14" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="hotGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="planetGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="6" result="c"/><feFlood flood-color="#6fd3ff" flood-opacity=".8"/><feComposite in2="c" operator="in"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".78" numOctaves="3" seed="41" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
    </filter>
    <filter id="rough" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence baseFrequency=".045 .09" numOctaves="2" seed="9" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="5"/>
    </filter>
    <radialGradient id="vignette" cx="50%" cy="47%" r="67%">
      <stop offset=".56" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".72"/>
    </radialGradient>
    <clipPath id="planetClip"><circle cx="625" cy="400" r="48"/></clipPath>
  </defs>

  <!-- ink-black space and distant warmth -->
  <rect width="1024" height="1024" fill="url(#space)"/>
  <ellipse cx="680" cy="350" rx="430" ry="330" fill="#ff4d1a" opacity=".14" filter="url(#blur80)"/>
  <ellipse cx="555" cy="500" rx="260" ry="225" fill="#ff8a2b" opacity=".18" filter="url(#blur34)"/>

  <!-- back layer: world-sized flare body -->
  <path d="M390 630 C470 452 548 310 1025 -70 L1086 90 C765 289 672 440 537 637 Z" fill="#ff4d1a" opacity=".19" filter="url(#blur34)"/>
  <path d="M398 618 C474 488 538 378 1060 32 C812 303 783 420 531 650 Z" fill="url(#flareHot)" opacity=".75" filter="url(#blur14)"/>
  <path d="M420 648 C521 529 590 481 1065 300 C773 497 702 567 503 683 Z" fill="#ff4d1a" opacity=".33" filter="url(#blur14)"/>
  <path d="M444 574 C536 372 700 223 1036 64 C775 268 701 407 537 604 Z" fill="#ffd166" opacity=".38" filter="url(#blur14)"/>

  <!-- mid layer: calligraphic ribbons of plasma -->
  <path d="M412 619 C500 549 493 407 663 303 C795 222 922 132 1039 -26 C930 224 796 321 699 390 C591 467 563 575 468 649 Z" fill="url(#flareHot)" opacity=".9"/>
  <path d="M435 622 C517 528 531 433 669 348 C810 261 870 215 1004 70 C889 276 819 330 711 401 C612 467 579 557 489 647 Z" fill="#fff3d6" opacity=".32" filter="url(#hotGlow)"/>
  <path d="M450 649 C577 570 693 533 1038 460 C798 582 674 634 494 690 Z" fill="#ff8a2b" opacity=".7"/>
  <path d="M438 589 C527 465 521 344 603 245 C700 129 831 68 978 -30 C803 131 722 204 663 298 C598 404 585 520 481 620 Z" fill="#ff4d1a" opacity=".72"/>
  <path d="M455 614 C525 522 543 476 629 412 C716 347 808 323 1018 204 C824 368 729 405 664 457 C591 516 562 578 490 637 Z" fill="url(#flareGold)" opacity=".92"/>
  <path d="M468 606 C538 514 553 452 624 391 C704 323 773 285 933 163" fill="none" stroke="#fff3d6" stroke-width="10" stroke-linecap="round" opacity=".86" filter="url(#hotGlow)"/>
  <path d="M484 629 C586 556 713 495 981 443" fill="none" stroke="#ffd166" stroke-width="5" stroke-linecap="round" opacity=".8"/>
  <path d="M463 575 C507 481 527 373 642 275 C760 175 857 129 1007 5" fill="none" stroke="#ff8a2b" stroke-width="7" stroke-linecap="round" opacity=".66"/>

  <!-- sharp white-hot ignition core -->
  <ellipse cx="485" cy="577" rx="133" ry="106" transform="rotate(-39 485 577)" fill="url(#sun)" opacity=".82" filter="url(#blur14)"/>
  <path d="M422 627 C472 562 513 504 604 436 C561 516 538 572 475 643 Z" fill="#fff3d6" opacity=".98" filter="url(#hotGlow)"/>
  <path d="M445 618 C485 578 518 542 568 509" fill="none" stroke="#fffdf1" stroke-width="11" stroke-linecap="round"/>

  <!-- newborn cold planet, suspended inside the furnace -->
  <g transform="rotate(-14 625 400)">
    <ellipse cx="625" cy="400" rx="84" ry="27" fill="none" stroke="#e8fbff" stroke-width="4" opacity=".3" filter="url(#planetGlow)"/>
    <ellipse cx="625" cy="400" rx="78" ry="23" fill="none" stroke="#6fd3ff" stroke-width="3" opacity=".92"/>
    <ellipse cx="625" cy="400" rx="92" ry="31" fill="none" stroke="#fff3d6" stroke-width="1.5" stroke-dasharray="184 26" opacity=".78"/>
    <circle cx="625" cy="400" r="49" fill="#6fd3ff" opacity=".22" filter="url(#planetGlow)"/>
    <circle cx="625" cy="400" r="47" fill="url(#planet)" stroke="#bdf1ff" stroke-width="2.5"/>
    <g clip-path="url(#planetClip)" opacity=".44" fill="none" stroke="#bdf1ff">
      <path d="M577 395 Q621 369 671 390" stroke-width="3"/>
      <path d="M581 416 Q624 394 670 413" stroke-width="2"/>
      <path d="M600 357 Q617 391 658 433" stroke-width="1.5" opacity=".5"/>
    </g>
    <path d="M548 407 Q625 426 701 392" fill="none" stroke="#07080c" stroke-width="5" opacity=".78"/>
    <path d="M552 410 Q625 428 698 395" fill="none" stroke="#6fd3ff" stroke-width="2"/>
  </g>

  <!-- giant match: foreground macro -->
  <g transform="rotate(-38 404 650)">
    <path d="M-170 614 L400 614 Q424 614 433 636 Q424 661 400 661 L-170 661 Z" fill="#1a1114" opacity=".75" transform="translate(0 18)" filter="url(#blur14)"/>
    <path d="M-165 603 L406 603 Q426 603 440 629 Q428 653 404 653 L-165 653 Z" fill="url(#wood)" stroke="#2b1b1b" stroke-width="5"/>
    <path d="M-145 612 L402 612" stroke="#fff3d6" stroke-width="7" opacity=".48" stroke-linecap="round"/>
    <path d="M-120 640 L395 640" stroke="#6d442f" stroke-width="5" opacity=".75" stroke-linecap="round"/>
    <path d="M18 619 L326 619 M-26 631 L282 631" stroke="#9b6b42" stroke-width="2" opacity=".58" stroke-linecap="round"/>
    <ellipse cx="447" cy="628" rx="94" ry="74" fill="#050609" opacity=".55" transform="translate(8 12)" filter="url(#blur14)"/>
    <ellipse cx="442" cy="622" rx="89" ry="70" fill="url(#head)" stroke="#07080c" stroke-width="9" filter="url(#rough)"/>
    <ellipse cx="463" cy="600" rx="43" ry="29" fill="#ff8a2b" opacity=".21"/>
    <path d="M394 597 Q434 558 488 582" fill="none" stroke="#fff3d6" stroke-width="4" opacity=".62" stroke-linecap="round"/>
    <g fill="#07080c" opacity=".58">
      <circle cx="401" cy="615" r="6"/><circle cx="424" cy="586" r="5"/><circle cx="450" cy="633" r="7"/><circle cx="476" cy="609" r="5"/><circle cx="414" cy="643" r="4"/><circle cx="492" cy="632" r="4"/>
    </g>
  </g>

  <!-- sparks and velocity marks -->
  <g stroke-linecap="round" filter="url(#hotGlow)">
    <path d="M536 648 L626 609" stroke="#ffd166" stroke-width="5"/>
    <path d="M595 574 L697 514" stroke="#fff3d6" stroke-width="3"/>
    <path d="M685 481 L784 422" stroke="#ff8a2b" stroke-width="4"/>
    <path d="M730 352 L822 294" stroke="#ffd166" stroke-width="3"/>
    <path d="M806 238 L873 191" stroke="#fff3d6" stroke-width="2"/>
  </g>
  <g fill="#fff3d6">
    <circle cx="632" cy="585" r="6"/><circle cx="706" cy="496" r="4"/><circle cx="780" cy="397" r="6"/><circle cx="846" cy="275" r="3"/>
  </g>
  <g fill="#ff4d1a" opacity=".9">
    <circle cx="559" cy="712" r="7"/><circle cx="680" cy="676" r="4"/><circle cx="740" cy="561" r="5"/><circle cx="887" cy="365" r="5"/>
  </g>

  <!-- restrained editorial labeling -->
  <text x="70" y="82" fill="#fff3d6" opacity=".34" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" letter-spacing="6">MAKE.FUN</text>
  <text x="512" y="956" text-anchor="middle" fill="#fff3d6" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="600" letter-spacing="7">ONE SPARK IS ALL IT TAKES</text>
  <path d="M256 921 H768" stroke="#fff3d6" stroke-width="1" opacity=".14"/>

  <!-- finish: edge falloff and almost-imperceptible film grain -->
  <rect width="1024" height="1024" fill="url(#vignette)" pointer-events="none"/>
  <rect width="1024" height="1024" filter="url(#grain)" opacity=".035" style="mix-blend-mode:soft-light" pointer-events="none"/>
</svg>
</body>
</html>
